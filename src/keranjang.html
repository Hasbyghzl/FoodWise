<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Keranjang</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
    <!-- <link rel="stylesheet" href="../style/keranjang.css" /> -->
  </head>
  <body>
    <nav>
      <div class="logo">
        <img src="../asset/FoodWise.png" alt="Logo" />
        <h1>FoodWise</h1>
      </div>
      <a href="../index.html">Home</a>
      <a href="../src/produk.html">Toko Poin</a>
      <a href="../src/keranjang.html">Keranjang</a>
      <a href="../src/login.html">Login</a>
    </nav>

    <div class="kategori">
      <input type="checkbox" id="cek1" name="cek1" value="cek2" />
      <label for="cek1">Produk</label>
      <p>Harga Satuan</p>
      <p>Jumlah</p>
      <p>Total Harga</p>
    </div>

    <div class="produk">
      <input type="checkbox" id="cek2" name="cek2" value="cek2" />
      <label for="cek2">Kebutuhan Harian</label>

      <div class="item">
        <input type="checkbox" />
        <img src="../asset/MinyakGoreng.jpg" alt="Minyak Goreng" />
        <p>Minyak Goreng</p>
        <p>5.000 Poin</p>
        <p>1 pcs</p>
        <p>5.000 Poin</p>
      </div>
    </div>

    <div class="produk">
      <input type="checkbox" id="cek3" name="cek3" value="cek3" />
      <label for="cek3">Kebutuhan Anak</label>

      <div class="item">
        <input type="checkbox" />
        <img src="../asset/SusuFormula.jpg" alt="Susu Formula" />
        <p>Susu Formula</p>
        <p>5.000 Poin</p>
        <p>1 pcs</p>
        <p>5.000 Poin</p>
      </div>

      <div class="item">
        <input type="checkbox" />
        <img src="../asset/SabunBayi.jpg" alt="Sabun Bayi" />
        <p>Sabun Bayi</p>
        <p>3.000 Poin</p>
        <p>2 pcs</p>
        <p>6.000 Poin</p>
      </div>
    </div>

    <div class="checkout">
      <p>Total Poin: 10.000 Poin</p>
      <button type="submit">Checkout</button>
    </div>
  </body>
</html>
