<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profil User - FoodWise</title>
</head>
<body>
    <div class="profile-dashboard"></div>
    <!--Sidebar Kiri: Profil User-->

    <div class="panel-kiri">
      <button type="button" class="tombol-kembali">←</button>

      <div class="kotak-foto">
        <img src="../asset/avatar-leon.jpg" alt="Foto Profil Leon Kennedy" class="foto-profil" />
        <button type="button" class="tombol-kamera">📷</button>
      </div>

      <h1 class="nama-user">Leon Kennedy</h1>
      <hr />

      <div class="kontak-user">
        <p> 0896-5476-3030</p>
        <p> kennedy.re@gmail.com</p>
      </div>

      <!-- BAGIAN KANAN: Dashboard Poin & Ranking -->
    <div class="panel-kanan">
      
      <div class="baris-atas">
        
        <!-- Kebutuhan Keharian -->
        <div class="kartu-kebutuhan">
          <h2 class="judul-kartu">Kebutuhan Keharian</h2>
          <p class="subjudul-kartu">Minyak Goreng</p>

          <div class="info-poin-baris">
            <p class="angka-besar">100,000 <span class="satuan">Point</span></p>
            <p class="sisa-poin">50,000 Lagi</p>
          </div>

          <!-- Progress Bar -->
          <div class="wadah-progress">
            <div class="isi-progress" style="width: 65%;"></div>
          </div>

          <button type="button" class="tombol-tukar-oranye">Tukar Sekarang ></button>
        </div>

        <!-- 2 Kartu Kecil  -->
        <div class="kolom-kanan-atas">
          
          <!-- Kartu 2: Akumulasi Poin -->
          <div class="kartu-kecil">
            <p class="label-kecil">Akumulasi Poin</p>
            <p class="angka-akumulasi">100,000</p>
            <button type="button" class="tombol-tukar-hijau">Tukar Poin ></button>
          </div>

          <!-- Kartu 3: Misi Harian -->
          <div class="kartu-kecil kartu-misi">
            <div class="ikon-koin">C</div>
            <div class="teks-misi">
              <p class="judul-misi">Misi Harian</p>
              <a href="#" class="link-misi">Pergi Ke Misi ></a>
            </div>
          </div>

        </div>
      </div>

      <!-- Ranking -->
      <div class="kartu-ranking">
        <h2 class="judul-ranking">Ranking</h2>

        <!-- Top 3 -->
        <div class="area-podium">
          
          <!-- poin 2 -->
          <div class="podium juara-2">
            <img src="../asset/avatar-2.jpg" alt="Juara 2" class="foto-podium" />
            <p class="peringkat">#2</p>
            <p class="poin-podium">Poin</p>
          </div>

          <!-- poin 1 -->
          <div class="podium juara-1">
            <p class="peringkat">#1</p>
            <p class="poin-podium">Poin</p>
          </div>

          <!-- poin 3 -->
          <div class="podium juara-3">
            <p class="peringkat">#3</p>
            <p class="poin-podium">Poin</p>
          </div>

          <!-- Daftar Peringkat seterusnya -->
<div class="daftar-peringkat">
  <div class="baris-peringkat rank-4">
    <p class="nomor-rank">#4</p>
    <p class="nama-rank">Nama</p>
    <p class="poin-rank">Poin</p>
  </div>
  <div class="baris-peringkat rank-5">
    <p class="nomor-rank">#5</p>
    <p class="nama-rank">Nama</p>
    <p class="poin-rank">Poin</p>
  </div>
  <div class="baris-peringkat rank-6">
    <p class="nomor-rank">#6</p>
    <p class="nama-rank">Nama</p>
    <p class="poin-rank">Poin</p>
  </div>
</div>

        </div>
    </div>
    
</body>
</html>
