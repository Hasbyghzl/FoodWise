<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Daftar - Food Wise</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/lucide-static@latest/font/lucide.css"
    />
    <link rel="stylesheet" href="../style/register.css" />
  </head>
  <body>
    <main class="register-page">
      <header class="brand-header">
        <img src="../asset/FoodWise.png" alt="Food Wise" class="brand-logo" />
        <span class="brand-name">Food Wise</span>
      </header>

      <section class="register-card" aria-labelledby="register-heading">
        <h1 id="register-heading" class="register-title">Daftar</h1>
        <p class="register-subtitle">Daftar untuk bergabung ke FoodWise</p>

        <form class="register-form" action="#" method="POST">
          <div class="form-group">
            <label for="username" class="form-label">Username</label>
            <input
              type="text"
              id="username"
              name="username"
              class="form-input"
              placeholder="Masukan username anda"
              required
            />
          </div>

          <div class="form-group">
            <label for="identifier" class="form-label"
              >Email/Nomor Telepon</label
            >
            <input
              type="text"
              id="identifier"
              name="identifier"
              class="form-input"
              placeholder="Masukan email atau nomor telepon anda"
              required
            />
          </div>

          <div class="form-group">
            <label for="password" class="form-label">Password</label>
            <div class="password-field">
              <input
                type="password"
                id="password"
                name="password"
                class="form-input"
                placeholder="Masukan password anda"
                required
              />
              <button
                type="button"
                id="toggle-password"
                class="toggle-password"
                aria-label="Tampilkan atau sembunyikan password"
              >
                <i id="eye-icon" class="icon-eye"></i>
              </button>
            </div>
          </div>

          <button type="submit" class="btn-primary">Daftar</button>

          <p class="register-redirect">
            Sudah punya akun?
            <a href="login.html" class="register-link">Klik ini!</a>
          </p>
        </form>
      </section>
    </main>

    <script>
      const toggleBtn = document.getElementById("toggle-password");
      const passwordInput = document.getElementById("password");
      const eyeIcon = document.getElementById("eye-icon");

      toggleBtn.addEventListener("click", () => {
        const isHidden = passwordInput.type === "password";
        passwordInput.type = isHidden ? "text" : "password";
        eyeIcon.className = isHidden ? "icon-eye-off" : "icon-eye";
      });
    </script>
  </body>
</html>
